<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monday's Home Cafe - Offline</title>
    <meta name="theme-color" content="#6b3e26" />

    <style>
      :root { color-scheme: light; --coffee: #542f20; --muted: #6f6a68; --cream: #f5f1ed; }
      * { box-sizing: border-box; }
      html { min-height: 100%; }
      body {
        margin: 0; min-height: 100vh; min-height: 100dvh; padding: 24px;
        display: grid; place-items: center; background: var(--cream); color: var(--coffee);
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      }
      .offline-container {
        width: min(100%, 480px); padding: clamp(24px, 4vw, 36px) clamp(20px, 5vw, 32px);
        text-align: center; background: #fff; border: 1px solid rgba(84,47,32,.04);
        border-radius: 26px; box-shadow: 0 16px 44px rgba(52,35,26,.10);
      }
      .offline-logo { display: block; width: 88px; height: 62px; object-fit: contain; margin: 0 auto 14px; }
      .coffee-icon { font-size: 40px; line-height: 1.1; margin: 0 auto 14px; filter: saturate(.75); }
      h1 { margin: 0 0 16px; font-family: Georgia, "Times New Roman", serif; font-size: clamp(28px, 5vw, 38px); line-height: 1.15; letter-spacing: -.6px; color: #542f20; }
      p { margin: 12px auto; max-width: 420px; font-size: 15px; line-height: 1.55; color: var(--muted); }
      .offline-message { margin-top: 22px; }
      .retry-button { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; min-width: 150px; margin-top: 22px; padding: 12px 28px; border: 0; border-radius: 12px; background: #704027; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; transition: background .2s, transform .2s; }
      .retry-button:hover { background: #542f20; }
      .retry-button:active { transform: translateY(1px); }
      .retry-button:focus-visible { outline: 3px solid #c99a78; outline-offset: 3px; }
      .status { margin-top: 20px; font-size: 14px; line-height: 1.5; color: #888; overflow-wrap: anywhere; }
      @media (max-width: 480px) {
        body { padding: 16px; }
        .offline-container { width: 100%; max-width: 380px; padding: 22px 18px 18px; border-radius: 18px; }
        .offline-logo { width: 68px; height: 48px; margin-bottom: 10px; }
        .coffee-icon { font-size: 34px; margin-bottom: 10px; }
        h1 { font-size: clamp(24px, 7vw, 30px); margin-bottom: 10px; }
        p { font-size: 13px; line-height: 1.45; }
        .offline-message { margin-top: 10px; }
        .retry-button { width: 100%; min-height: 42px; margin-top: 14px; padding: 10px 18px; font-size: 14px; }
        .status { margin-top: 10px; font-size: 12px; }
      }
      @media (max-height: 620px) and (min-width: 481px) { body { padding-block: 14px; } .offline-container { padding-block: 22px; } .offline-logo { height: 54px; margin-bottom: 8px; } .coffee-icon { font-size: 38px; margin-bottom: 10px; } h1 { margin-bottom: 10px; } p { margin: 8px auto; } .retry-button { margin-top: 12px; } .status { margin-top: 10px; } }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; scroll-behavior: auto !important; } }
    </style>
  </head>

  <body>
    <main class="offline-container">
      <img
        id="offlineLogo"
        src=""
        alt="Monday's Home Cafe"
        class="offline-logo"
      />

      <div class="coffee-icon" aria-hidden="true">☕</div>

      <h1>You're Offline</h1>

      <p>
        Monday's Home Cafe is currently unable to connect to the internet.
      </p>

      <p class="offline-message">
        Please check your internet connection and try again.
      </p>

      <button
        class="retry-button"
        type="button"
        onclick="window.location.reload()"
      >
        Try Again
      </button>

      <div class="status" id="connectionStatus">
        You are currently offline.
      </div>
    </main>

    <script>
      const logo = document.getElementById("offlineLogo");
      const status = document.getElementById("connectionStatus");

      function setOfflineLogo() {
        if (!logo) return;
        const controller = navigator.serviceWorker && navigator.serviceWorker.controller;
        if (controller) {
          const root = new URL(controller.scriptURL).pathname.replace(/\/sw\.js$/, "/");
          logo.src = root + "images/logo.png";
        } else {
          logo.src = "/images/logo.png";
        }
        logo.addEventListener("error", () => { logo.hidden = true; }, { once: true });
      }

      function showConnectionState() {
        if (!status) return;
        status.textContent = navigator.onLine
          ? "Still trying to reach Monday's Home Cafe. Tap Try Again to reload."
          : "You are currently offline. Check your internet connection and try again.";
      }

      setOfflineLogo();
      showConnectionState();
      window.addEventListener("online", () => {
        if (status) status.textContent = "Connection detected. Checking the cafe website…";
        window.setTimeout(() => window.location.reload(), 1200);
      });
      window.addEventListener("offline", showConnectionState);
    </script>
  </body>
</html>
